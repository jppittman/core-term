[package]
name = "pixelflow-search"
version = "0.1.0"
edition = "2024"
description = "A generic graph search framework for algebraic optimization and scheduling"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[dependencies]
libm = "0.2.15"
pixelflow-ir = { path = "../pixelflow-ir", default-features = false, features = ["std"] }

[dev-dependencies]
# Rewrite-soundness tests check a rule's two sides numerically against the
# language's own semantics; `oracle` is what exposes that walker.
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

[features]
# Gates the capabilities that need a process environment or filesystem:
# `ExprNnue::save`/`load`/`from_bytes` and the `PIXELFLOW_NNUE_WEIGHTS`
# opt-in branch of `env_extraction_policy`. With `std` off, the static
# latency prior is the only extraction policy compiled in — not a fallback,
# the opt-in mechanism simply doesn't exist without an environment. CI's
# `no-std` job checks this configuration keeps building.
std = []
default = ["std"]
# Round 2b extraction-overhead investigation (docs/plans/2026-08-17-cost-model-domain.md,
# anti-row A6): thread-local wall-clock buckets in `egraph::profile`, wrapped
# around specific phases of `IncrementalExtractor::extract_choices_only`.
# Off by default and not re-exported from `egraph`'s public API list — an
# opt-in measurement instrument, not a shipped capability.
extraction-profile = []
