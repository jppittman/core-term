[package]
name = "pixelflow-search"
version = "0.1.0"
edition = "2024"
description = "A generic graph search framework for algebraic optimization and scheduling"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[dependencies]
libm = "0.2.15"
pixelflow-ir = { path = "../pixelflow-ir", default-features = false, features = ["std"] }

[dev-dependencies]
# Rewrite-soundness tests check a rule's two sides numerically against the
# language's own semantics; `oracle` is what exposes that walker.
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

[features]
# Feature-flagged saturation telemetry: one JSONL record per production
# e-graph optimizer invocation (see `src/telemetry.rs` and `runtime.rs`'s
# module docs for the two-line usage). std-only (it implies `std`: the sink
# is `std::fs`/`std::io`), default OFF — with the feature off, `telemetry` is
# not even declared as a module in `lib.rs`
# (`#[cfg(feature = "saturation-telemetry")] pub mod telemetry;`), so there
# is nothing in the binary to reference either way.
saturation-telemetry = ["std"]
