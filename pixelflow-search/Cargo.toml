[package]
name = "pixelflow-search"
version = "0.1.0"
edition = "2024"
description = "A generic graph search framework for algebraic optimization and scheduling"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[dependencies]
libm = "0.2.15"
rand = "0.8"
pixelflow-ir = { path = "../pixelflow-ir", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
# Rewrite-soundness tests check a rule's two sides numerically against the
# language's own semantics; `oracle` is what exposes that walker.
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

# getrandom has no OS RNG source on wasm32-unknown-unknown; "js" routes it
# through the browser's crypto API instead. Needed because pixelflow-core
# (and everything downstream, including pixelflow-runtime's wasm target)
# depends on this crate unconditionally.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
std = ["rand/std", "dep:serde", "dep:serde_json"]
default = ["std"]
