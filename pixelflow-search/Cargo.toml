[package]
name = "pixelflow-search"
version = "0.1.0"
edition = "2024"
description = "A generic graph search framework for algebraic optimization and scheduling"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[dependencies]
libm = "0.2.15"
pixelflow-ir = { path = "../pixelflow-ir", default-features = false, features = ["std"] }

[dev-dependencies]
# Rewrite-soundness tests check a rule's two sides numerically against the
# language's own semantics; `oracle` is what exposes that walker.
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

[features]
# Vestigial: it no longer gates anything. It cannot simply be deleted, because
# the crate does not actually build without `std` — `egraph/extraction.rs`
# calls `std::env::var`/`std::fs::read` with no gate on the callers — so the
# feature is a claim the crate cannot honour either way. Gating those callers
# is the real fix; until then this keeps `pixelflow-pipeline`'s
# `training = ["pixelflow-search/std"]` resolving.
std = []
default = ["std"]
