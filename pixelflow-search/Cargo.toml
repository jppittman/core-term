[package]
name = "pixelflow-search"
version = "0.1.0"
edition = "2024"
description = "A generic graph search framework for algebraic optimization and scheduling"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[dependencies]
libm = "0.2.15"
pixelflow-ir = { path = "../pixelflow-ir", default-features = false, features = ["std"] }
# Cold-start Guide checkpoint loading only (`nnue::guide::linear` — the
# linear model `pixelflow-pipeline`'s `train_guide` writes as JSON). Value-
# based parsing, no `derive`: the checkpoint's writer (a separate crate, one
# layer up the dependency graph) owns the schema; this crate only reads the
# handful of named fields it needs, so a `Deserialize`-derived struct here
# would be a second, drift-prone restatement of a schema it doesn't own.
serde_json = "1.0"

[dev-dependencies]
# Rewrite-soundness tests check a rule's two sides numerically against the
# language's own semantics; `oracle` is what exposes that walker.
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

[features]
# Vestigial: it no longer gates anything. It cannot simply be deleted, because
# the crate does not actually build without `std` — `egraph/extraction.rs`
# calls `std::env::var`/`std::fs::read` with no gate on the callers — so the
# feature is a claim the crate cannot honour either way. Gating those callers
# is the real fix; until then this keeps `pixelflow-pipeline`'s
# `training = ["pixelflow-search/std"]` resolving.
std = []
default = ["std"]
# Round 2b extraction-overhead investigation (docs/plans/2026-08-17-cost-model-domain.md,
# anti-row A6): thread-local wall-clock buckets in `egraph::profile`, wrapped
# around specific phases of `IncrementalExtractor::extract_choices_only`.
# Off by default and not re-exported from `egraph`'s public API list — an
# opt-in measurement instrument, not a shipped capability.
extraction-profile = []
