[package]
name = "pixelflow-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Procedural macros for PixelFlow: express algebra, get SIMD"
license = "Apache-2.0"

[lib]
proc-macro = true
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[features]
# P3 transition scaffolding (docs/plans/2026-07-20-kernel-unification.md):
# route eligible `kernel!` bodies through the arena/JIT backend instead of the
# combinator emitter. Not the default until the parity suite and font goldens
# say so — see the routing note in `kernel`.
arena-backend = []
# Forwards to `pixelflow-search/saturation-telemetry`: the macro-tier
# `optimize()` entry (`src/optimize.rs`) emits one JSONL saturation record
# per e-graph pass when this is on. See `pixelflow-search/src/telemetry.rs`
# for the record shape and sink.
saturation-telemetry = ["pixelflow-search/saturation-telemetry"]

[dependencies]
syn = { version = "2", features = ["full", "fold", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-search = { path = "../pixelflow-search" }
pixelflow-codegen = { path = "../pixelflow-codegen" }

[dev-dependencies]
pixelflow-core = { path = "../pixelflow-core" }
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }
criterion = "0.5"

[[bench]]
name = "macro_bench"
harness = false
