[package]
name = "pixelflow-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
bench = false

[features]
# Forwards to both crates that actually invoke saturation: `pixelflow-codegen`
# (the `Lattice::bake` -> `jit_cache` -> `optimize_runtime_arena` runtime
# tier) and `pixelflow-compiler` (the `kernel!`/`kernel_jit!` macro tier
# every `kernel!` in this crate itself expands through). See
# `pixelflow-search/src/telemetry.rs`.
saturation-telemetry = [
    "pixelflow-codegen/saturation-telemetry",
    "pixelflow-compiler/saturation-telemetry",
]

[dependencies]
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-codegen = { path = "../pixelflow-codegen" }
pixelflow-compiler = { path = "../pixelflow-compiler" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benches"
harness = false
