[package]
name = "pixelflow-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
bench = false

[dependencies]
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-compiler = { path = "../pixelflow-compiler" }
pixelflow-search = { path = "../pixelflow-search" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benches"
harness = false

[[bin]]
name = "calibrate_costs"
path = "src/bin/calibrate_costs.rs"
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false
