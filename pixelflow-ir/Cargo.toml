[package]
name = "pixelflow-ir"
version = "0.1.0"
edition = "2024"
description = "Unified Intermediate Representation and SIMD Backends for PixelFlow"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[lints]
workspace = true

[dependencies]
libm = "0.2.15"


[dev-dependencies]
# Self-dependency so this crate's own `tests/` see the oracle. Nothing else
# turns the feature on, which is what keeps a tree-walking evaluator out of
# every shipped build.
pixelflow-ir = { path = ".", features = ["oracle"] }

[features]
default = ["std"]
std = []
# The scalar differential-testing oracle (`eval`). Test-only: PixelFlow renders
# exclusively through the JIT, so no shipped build may reach an interpreter.
oracle = []
