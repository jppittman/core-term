# corpus_split.toml — three-tier corpus split manifest (plan 0.2, audit L4).
#
# WHY THIS FILE EXISTS — the leakage rationale:
# Every synthetic expression in the corpus comes from the same BwdGenerator.
# A random train/test split over one generator's output is leakage, not a
# holdout: the generator reuses the same structural motifs across draws, so
# near-duplicates land on both sides of the split and the "held-out" score
# measures memorization. The 2026-07-08 run had NO split at all; its
# "validation MAE" was computed on training samples (audit L4).
#
# The unit of holdout is therefore the FAMILY — one (band, seed) generator
# stream — never the individual expression:
#   * TRAIN: the bulk of the generator bands, family seeds 0-7.
#   * DEV:   entire bands held out across the size spectrum (tiny -> huge).
#     Nothing from these bands is ever trained on; DEV drives the per-round
#     SELECT decision.
#   * FINAL: the five named production kernels (real pixelflow shapes) plus
#     one fully held-out synthetic band. Never used for any selection
#     decision; touched only for the paper's claimed numbers.
#
# `bands` are indices into gen_bench_corpus.rs's BANDS table (38 bands,
# 0..=37, ordered by max_depth). `seeds` are inclusive [start, end]
# family-seed ranges. split.rs validates the manifest at load: an empty
# tier, an inverted range, or a seed-range overlap on any band shared by
# two tiers is a loud error. Structural dedup ACROSS tiers happens at
# corpus build time; a duplicate spanning tiers is dropped from TRAIN,
# never from DEV/FINAL.

[train]
bands = [0, 2, 3, 4, 5, 7, 8, 10, 11, 13, 14, 15, 17, 18, 19, 20, 21, 23, 24, 25, 26, 28, 29, 30, 31, 32, 34, 35, 36, 37]
seeds = [[0, 7]]

[dev]
# One whole band per size class, spanning the depth spectrum:
# band 1 (depth 2), 6 (depth 4), 9 (depth 5), 16 (depth 7), 22 (depth 10),
# 27 (depth 12), 33 (depth 18).
bands = [1, 6, 9, 16, 22, 27, 33]
seeds = [[0, 7]]
# Round 1b (docs/plans/2026-09-01-phase3-round1b-domain-shift-registration.md
# §3): named, DEV-only, out-of-distribution families outside the band/seed
# BwdGenerator system entirely — a structure-aware generator built once per
# name, the same way `[final] kernels` names real production kernels rather
# than a generator draw stream. Written to a SEPARATE file, corpus_dev_ood.bin
# (pixelflow-pipeline/src/bin/gen_sh_corpus.rs, gen_bezier_corpus.rs) — never
# merged into corpus_dev.bin, so Round 1's corpus_dev.bin MD5
# (3026133ebba066eeca10f658da554400) stays untouched. Both families
# registered by the plan (`sh`, `bezier`) now have a generator.
families = ["sh", "bezier"]

[final]
# Band 12 (depth 6, leaf 0.3, 4 vars): the fully held-out synthetic family,
# sized like the real production kernels below.
bands = [12]
seeds = [[0, 7]]
# The five original named production kernels, plus the withheld real-shader
# benchmark set (12 ShaderToy/iquilezles.org ports, pixelflow-pipeline/src/
# shader_bench.rs — attribution table + porting notes in that module's doc
# comment). Same FINAL discipline as everything else in this list: never
# used for a SELECT decision, touched only for the paper's claimed numbers.
kernels = ["swirl", "circle_sdf", "poly", "redundant", "normalize", "cosine_palette", "smooth_min_scene", "mandelbrot_distance", "star_sdf", "gyroid_slice", "plasma", "domain_warp_fbm", "kaleidoscope_fold", "metaballs", "julia_set", "smoothstep_vignette", "torus_slice"]
