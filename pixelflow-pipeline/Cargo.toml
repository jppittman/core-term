[package]
name = "pixelflow-pipeline"
version = "0.1.0"
edition = "2024"
description = "Training and data generation pipeline for PixelFlow"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[features]
default = ["training"]
# `pixelflow-ir/oracle` gives the label-minting harness its independent
# scalar correctness reference (audit H1/H2) — training tooling only, so the
# shipped crates still cannot name a tree-walking evaluator. It has to be a
# real (non-dev) dependency feature: `gen_bench_corpus` is a `[[bin]]`
# target that calls `eval_scalar`, and a `[dev-dependencies]` feature does
# not reach it.
training = ["pixelflow-ir/oracle"]
profiling = ["pprof"]

[dependencies]
pixelflow-codegen = { path = "../pixelflow-codegen" }
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-search = { path = "../pixelflow-search" }
pixelflow-core = { path = "../pixelflow-core" }
pixelflow-compiler = { path = "../pixelflow-compiler" }
libm = "0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.5"
libc = "0.2.183"
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[dev-dependencies]
criterion = "0.5"
pixelflow-compiler = { path = "../pixelflow-compiler" }
pixelflow-ir = { path = "../pixelflow-ir", features = ["oracle"] }

[[bench]]
name = "nnue_training_suite"
harness = false

[[bench]]
name = "macro_bench"
harness = false


[[bin]]
name = "bench_jit_corpus"
path = "src/bin/bench_jit_corpus.rs"
required-features = ["training"]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[[bin]]
name = "gen_bench_corpus"
path = "src/bin/gen_bench_corpus.rs"
required-features = ["training"]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

