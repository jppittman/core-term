name: Presubmit Tests

on:
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so a hung job doesn't linger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop for non-test hangs (compile / doctests). The precise
    # "no test over 10 minutes" policy is enforced per-test by nextest below.
    timeout-minutes: 30
    strategy:
      # Continue running other jobs even if one fails, to see all failures
      fail-fast: false
      matrix:
        # Test on multiple operating systems
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Caching dependencies speeds up subsequent runs.
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Compile tests first so the run step below is (mostly) pure execution.
      - name: Build tests
        shell: bash
        run: cargo nextest run --workspace --all-features --no-run

      # Per-test hard cap: nextest TERMINATES any test exceeding 10 minutes and
      # names it in the log (see .config/nextest.toml), failing the run.
      - name: Run workspace tests
        shell: bash
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests; run them separately.
      - name: Run doctests
        shell: bash
        run: cargo test --workspace --all-features --doc

  isa-matrix:
    name: ISA matrix (SSE2/AVX2/AVX-512)
    runs-on: ubuntu-latest
    # Three full `cargo test --workspace` + `cargo clippy` passes (one per
    # supported ISA level) in one job; each pass alone can take several
    # minutes on a cold cache.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-isa-matrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-isa-matrix-

      # .cargo/config.toml sets no target-cpu/target-feature, so the jobs
      # above only ever exercise whichever ISA level SSE2-baseline codegen
      # happens to be. This runs cargo test + clippy again under +avx2,+fma
      # and +avx512f -- skipping cleanly (not silently) whichever of those
      # ubuntu-latest's actual hardware doesn't support; see
      # `xtask isa-matrix`'s own doc comment for the per-level detection.
      - name: Run ISA matrix (test + clippy per supported level)
        shell: bash
        run: cargo run -p xtask -- isa-matrix --clippy
