name: Presubmit Tests

on:
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so a hung job doesn't linger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cl-metadata:
    name: CL metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and CL history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CL title and commit subjects
        env:
          CL_TITLE: ${{ github.event.pull_request.title }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/check-cl-metadata.sh
          "$CL_TITLE"
          "$BASE_COMMIT"
          "$HEAD_COMMIT"

  # A build.rs can declare (via rustc-check-cfg) a display-driver cfg that no
  # CI job ever actually builds -- that's exactly how the headless driver
  # went 22-errors-broken with a fully green CI history. This is a fast,
  # blocking metadata check (not a build): it fails the moment a new driver
  # cfg is declared without a maintainer recording how CI covers it, instead
  # of leaving that as a silent gap someone has to rediscover by hand.
  driver-cfg-coverage:
    name: Display driver CI coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check every declared display driver cfg has recorded CI coverage
        run: bash scripts/check-driver-cfg-coverage.sh

  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Catches known security/soundness advisories (RUSTSEC) in the resolved
      # dependency graph. Config lives in deny.toml; only `advisories` is
      # checked here — see the note at the top of that file for why `bans`,
      # `licenses`, and `sources` aren't gated on yet.
      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cross-target-abi:
    name: Cross-target ABI (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-

      # This integration target expands the public `kernel!` macro in a
      # consumer crate. A host-only proc-macro check would miss generated code
      # that disagrees with the second supported architecture's JIT ABI.
      - name: Type-check default and arena kernel routing on aarch64
        shell: bash
        run: |
          cargo check -p pixelflow-compiler \
            --test kernel_routing_parity \
            --target aarch64-unknown-linux-gnu
          cargo check -p pixelflow-compiler \
            --test kernel_routing_parity \
            --features arena-backend \
            --target aarch64-unknown-linux-gnu

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop for non-test hangs (compile / doctests). The precise
    # "no test over 10 minutes" policy is enforced per-test by nextest below.
    timeout-minutes: 30
    strategy:
      # Continue running other jobs even if one fails, to see all failures
      fail-fast: false
      matrix:
        # Test on multiple operating systems
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Caching dependencies speeds up subsequent runs.
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Compile tests first so the run step below is (mostly) pure execution.
      - name: Build tests
        shell: bash
        run: cargo nextest run --workspace --all-features --no-run

      # Per-test hard cap: nextest TERMINATES any test exceeding 10 minutes and
      # names it in the log (see .config/nextest.toml), failing the run.
      - name: Run workspace tests
        shell: bash
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests; run them separately.
      - name: Run doctests
        shell: bash
        run: cargo test --workspace --all-features --doc

  behavior-contracts:
    name: Behavior contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-behavior-contracts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-behavior-contracts-

      # These are named public-behavior contracts, not an incidental subset of
      # the workspace suite. nextest's explicit `--no-tests fail` makes deleting
      # or renaming them a hard failure instead of a green zero-test run.
      - name: Check default and arena kernel routing parity
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            projection_kernels_stay_on_field_domain_semantics
            routed_abs_recip_matches_truth
            routed_arithmetic_matches_truth
            routed_params_match_truth
            routed_piecewise_matches_truth
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-compiler \
              --test kernel_routing_parity \
              -E "test(=$test_name)" \
              --no-tests fail
            cargo nextest run -p pixelflow-compiler \
              --test kernel_routing_parity \
              --features arena-backend \
              -E "test(=$test_name)" \
              --no-tests fail
          done

      - name: Check JIT/interpreter glyph parity
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            descender_glyph_bake_matches_interpreter
            double_counter_glyph_bake_matches_interpreter
            round_glyph_bake_matches_interpreter
            simple_glyph_bake_matches_interpreter
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test kernel_glyph_golden \
              -E "test(=$test_name)" \
              --no-tests fail
          done

      - name: Check scene color, reflection, and antialiasing contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            color_chrome_sphere
            floor_only
            mullet_vs_3channel_comparison
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test scene3d_test \
              -E "test(=$test_name)" \
              --profile ci \
              --no-tests fail
          done

      - name: Check ray/surface composition contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            chrome_sphere_on_checkerboard
            sphere_on_floor
            sphere_on_matte_floor
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test raymarch_sphere \
              -E "test(=$test_name)" \
              --profile ci \
              --no-tests fail
          done

  isa-matrix:
    name: ISA matrix (SSE2/AVX2/AVX-512)
    runs-on: ubuntu-latest
    # Three full `cargo test --workspace` + `cargo clippy` passes (one per
    # supported ISA level) in one job; each pass alone can take several
    # minutes on a cold cache.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-isa-matrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-isa-matrix-

      # .cargo/config.toml sets no target-cpu/target-feature, so the jobs
      # above only ever exercise whichever ISA level SSE2-baseline codegen
      # happens to be. This runs cargo test + clippy again under +avx2,+fma
      # and +avx512f -- skipping cleanly (not silently) whichever of those
      # ubuntu-latest's actual hardware doesn't support; see
      # `xtask isa-matrix`'s own doc comment for the per-level detection.
      - name: Run ISA matrix (test + clippy per supported level)
        shell: bash
        run: cargo run -p xtask -- isa-matrix --clippy

  # Every display driver's cfg (use_cocoa_display, use_x11_display,
  # use_web_display) should be verifiably exercised *somewhere* in CI, or its
  # buildability is a total blind spot -- exactly how the now-deleted headless
  # driver went 22-errors-broken without a single red check. Cocoa/X11 are
  # covered by the `test`/`clippy` jobs above (build.rs's target_os priority
  # always resolves to one of them there). Nothing above ever targets wasm32,
  # so use_web_display has never been compiled by CI at all.
  #
  # This job is deliberately non-blocking: pixelflow-ir's `backend::emit`
  # module (the JIT machine-code emitter) is compiled unconditionally --  not
  # feature- or arch-gated -- and only has x86_64/aarch64 constants defined,
  # so every crate in this dependency chain (pixelflow-ir -> pixelflow-search
  # -> pixelflow-core -> pixelflow-runtime) currently fails to build for
  # wasm32. All three checks below are expected to be RED today. That's a
  # real, substantial gap (a wasm32 JIT backend does not exist), not a
  # regression this job should gate merges on. Its purpose is to keep that
  # gap *visible and tracked* instead of silently unreachable by any check,
  # so the day someone starts fixing it, this job is what turns green and
  # proves it -- and so nobody has to rediscover this by hand.
  wasm32-status:
    name: WASM target status (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32-

      # Reported separately (not one `cargo check --workspace`) so the log
      # says exactly which crates build for wasm32 today and which don't,
      # instead of one pass/fail bit for the whole dependency graph.
      - name: Check wasm32 buildability per crate
        shell: bash
        run: |
          set -uo pipefail
          check() {
            local label=$1
            shift
            echo "::group::$label"
            if cargo check --target wasm32-unknown-unknown "$@"; then
              echo "PASS: $label"
            else
              echo "::warning::FAIL (known, tracked): $label does not build for wasm32-unknown-unknown"
            fi
            echo "::endgroup::"
          }
          check "pixelflow-search" -p pixelflow-search
          check "pixelflow-core" -p pixelflow-core
          check "pixelflow-runtime web driver" -p pixelflow-runtime --no-default-features --features display_web
        env:
          DISPLAY_DRIVER: web

  # `pixelflow-ir` declares `no_std` support (`#![cfg_attr(not(feature =
  # "std"), no_std)]`) and `pixelflow-search` declares `std` as an optional,
  # default-on feature -- but every existing CI job builds both with `std`
  # on, via `--all-features` or their own `default` feature sets. That's the
  # headless-driver failure shape again: a build configuration the crate
  # advertises, that no runner has ever actually compiled, and workspace-wide
  # `--all-features`/`--workspace` runs can't catch because Cargo unifies
  # features across every crate in the build rather than checking each crate
  # in isolation. Neither is hypothetical:
  #   - `cargo check -p pixelflow-ir --no-default-features` fails with 218
  #     errors (missing f32 methods under `no_std`, `ExprId` deref mismatches
  #     in `arena.rs`), regardless of whether `alloc` is separately enabled.
  #   - `cargo check -p pixelflow-search --no-default-features` fails because
  #     `env_extraction_policy`/`load_opt_in_weights` in
  #     `egraph/extraction.rs` call `std::env::var`/`std::fs::read`/
  #     `ExprNnue::from_bytes` unconditionally, with no matching
  #     `#[cfg(feature = "std")]` gate on the callers.
  # Fixing either is a real feature of unknown scope, not a CI config issue,
  # so this job -- like wasm32-status -- only keeps the gap visible instead
  # of leaving it dark.
  std-off-status:
    name: no_std / std-off feature status (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nostd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nostd-

      - name: Check crates that declare an optional/disable-able `std` feature, with it off
        shell: bash
        run: |
          set -uo pipefail
          check() {
            local label=$1
            shift
            echo "::group::$label"
            if cargo check "$@"; then
              echo "PASS: $label"
            else
              echo "::warning::FAIL (known, tracked): $label"
            fi
            echo "::endgroup::"
          }
          check "pixelflow-ir --no-default-features (no std, no alloc feature)" -p pixelflow-ir --no-default-features
          check "pixelflow-ir --no-default-features --features alloc (no std)" -p pixelflow-ir --no-default-features --features alloc
          check "pixelflow-search --no-default-features (no std)" -p pixelflow-search --no-default-features
